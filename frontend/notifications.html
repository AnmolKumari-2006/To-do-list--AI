<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Notifications · TaskPilot AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="scrim"></div>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand"><img src="images/logo-light.png" alt="TaskPilot AI" class="brand-logo brand-logo-light"><img src="images/logo-dark.png" alt="TaskPilot AI" class="brand-logo brand-logo-dark"></div>
    <div class="sidebar-scroll">
      <div class="nav-group">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
        <a class="nav-item" href="tasks.html"><i class="fa-solid fa-list-check"></i><span>Tasks</span></a>
        <a class="nav-item" href="calendar.html"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>
        <a class="nav-item" href="statistics.html"><i class="fa-solid fa-chart-pie"></i><span>Statistics</span></a>
        <a class="nav-item" href="notifications.html"><i class="fa-solid fa-bell"></i><span>Notifications</span><span class="nav-badge"></span></a>
        <a class="nav-item" href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
      </div>
    </div>
    <div class="sidebar-foot">
      <div class="user-pill">
        <div class="avatar"></div>
        <div class="who"><div class="name"></div><div class="email"></div></div>
        <button class="btn-icon" title="Log out" onclick="logoutUser()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="btn-icon menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <div class="greeting"><h1>Notifications</h1><span class="muted">All task reminders and missed alerts.</span></div>
      </div>
    </div>

    <div class="glass card" id="notificationsList">
      <div class="section-head"><h3>Reminder feed</h3></div>
      <div id="notificationItems" class="notification-list"></div>
      <div id="notificationEmpty" class="muted" style="padding:18px;">No reminders yet. Set a reminder on a task to see it here.</div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.1/sweetalert2.all.min.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/notifications.js"></script>
</body>
</html>
